spring.application.name=finance-tracker

# DataSource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:finance_tracker}
spring.datasource.username=${POSTGRES_USER:finance_user}
spring.datasource.password=${POSTGRES_PASSWORD:finance_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (Connection Pool)
spring.datasource.hikari.pool-name=FinanceHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=8089